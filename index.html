<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrippleNCJ Studio | Breakpoint</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ===== 60-30-10 COLOR RULE ===== */
        :root {
            --bg-60: #080808;       /* พื้นหลังดำหม่นอ่อน */
            --card-30: #171717;     /* การ์ดและแผงดำหม่น */
            --accent-10: #c9a35b;   /* สีทองอ่อนสำหรับไฮไลท์และข้อความไว้อาลัย */
            --accent-deep: #8d6a2b;
            --text-main: #f1ebde;
            --text-muted: #c5baa9;
            --line-soft: rgba(201, 163, 91, 0.14);
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Kanit', sans-serif;
            background: var(--bg-60); /* ประยุกต์ใช้ 60% */
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ===== SPLASH SCREEN (ไว้อาลัย - เวอร์ชันคริสเตียน) ===== */
        #splash-screen {
            position: fixed;
            inset: 0;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            height: 100dvh;
            background-color: #090909; /* สีพื้นหลังโทนเข้มและสงบนิ่ง */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            z-index: 99999; /* อยู่เหนือทุกเมนูและ Navbar ในเว็บ */
            opacity: 1;
            transition: opacity 0.8s ease-in-out;
            color: #ffffff;
            font-family: 'Kanit', sans-serif;
            text-align: center;
            overflow-y: auto;
            padding: 24px 16px;
        }

        .splash-content {
            width: 100%;
            max-width: 650px;
            padding: 30px;
            margin: auto;
        }

        /* รูปพระฉายาลักษณ์องค์ภา */
        .royal-image {
            max-width: min(100%, 320px);
            max-height: 380px;
            width: auto;
            margin-bottom: 25px;
            border: 2px solid #c9a35b; /* กรอบสีทองนวลสุภาพ */
            box-shadow: 0px 4px 20px rgba(0,0,0,0.6);
        }

        .splash-text {
            font-size: 26px;
            font-weight: 600;
            color: #dfb76c;
            margin-bottom: 10px;
        }

        .splash-subtext-main {
            font-size: 16px;
            color: #bbbbbb;
            margin-bottom: 5px;
        }

        .splash-title {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.6;
            color: #ffffff;
            margin-bottom: 20px;
        }

        .splash-space {
            height: 1px;
            background: linear-gradient(to right, transparent, #dfb76c, transparent);
            margin: 20px auto;
            width: 60%;
        }

        .splash-subtext {
            font-size: 15px;
            color: #cccccc;
            margin-bottom: 5px;
        }

        .splash-owner {
            font-size: 16px;
            color: #dfb76c;
            font-weight: 600;
        }

        /* ปุ่มเข้าสู่เว็บไซต์ */
        .enter-btn {
            margin-top: 35px;
            background-color: transparent;
            color: #d6ba80;
            border: 1px solid #c9a35b;
            padding: 10px 35px;
            font-size: 15px;
            font-family: 'Kanit', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .enter-btn:hover {
            background-color: #c9a35b;
            color: #111111;
        }

        /* ===== NAVBAR ===== */
        nav {
            position: fixed;
            top: 0; width: 100%; height: 75px;
            padding: 0 5%;
            display: flex; align-items: center;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(11,11,11,0.9), transparent);
            transition: var(--transition);
        }

        nav.scrolled { 
            background: var(--bg-60); 
            height: 65px; 
            border-bottom: 1px solid var(--line-soft); 
        }
        .logo img { height: 45px; }

        /* ===== HERO ===== */
        .hero {
            height: 100vh;
            display: flex; align-items: center;
            padding: 0 5%;
            position: relative;
            background: linear-gradient(to right, rgba(11,11,11,0.95) 20%, transparent 80%),
                        url('https://img.youtube.com/vi/uOlQF24CTXY/maxresdefault.jpg') center/cover;
        }

        .hero-content { max-width: 650px; z-index: 2; }
        .hero-tag { color: var(--accent-10); font-weight: 600; letter-spacing: 2px; margin-bottom: 10px; } /* ประยุกต์ใช้ 10% */
        .hero h1 { font-size: clamp(3rem, 8vw, 5rem); line-height: 1.1; margin-bottom: 20px; }
        
        .btn-play {
            padding: 12px 30px; border-radius: 5px; font-size: 1.1rem;
            cursor: pointer; display: inline-flex; align-items: center; gap: 10px;
            font-weight: 600; border: none; 
            background: var(--text-main); color: #000;
            transition: var(--transition);
        }
        .btn-play:hover { 
            background: var(--accent-10); /* ประยุกต์ใช้ 10% เมื่อ Hover */
            color: var(--text-main); 
            transform: scale(1.05); 
        }

        /* ===== EPISODES SECTION ===== */
        .section { padding: 60px 5%; }
        .section-title { font-size: 1.8rem; margin-bottom: 30px; border-left: 4px solid var(--accent-10); padding-left: 15px; } /* ประยุกต์ใช้ 10% */

        /* Season Selector */
        .season-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .season-btn {
            padding: 10px 20px;
            background: var(--card-30);
            border: 2px solid var(--line-soft);
            color: var(--text-main);
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Kanit', sans-serif;
            font-size: 1rem;
            border-radius: 5px;
        }

        .season-btn:hover {
            border-color: var(--accent-10);
            color: var(--accent-10);
        }

        .season-btn.active {
            background: var(--accent-10);
            border-color: var(--accent-10);
            color: #000;
        }

        /* Episodes List */
        .episodes-list {
            display: grid;
            gap: 15px;
        }

        .ep-row {
            display: grid;
            grid-template-columns: 80px 1fr 150px;
            gap: 15px;
            background: var(--card-30);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--line-soft);
            cursor: pointer;
            align-items: center;
            transition: var(--transition);
        }

        .ep-row:hover {
            background: rgba(201, 163, 91, 0.08);
            border-color: rgba(201, 163, 91, 0.25);
            transform: translateX(5px);
        }

        .ep-thumbnail {
            width: 80px;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-radius: 4px;
        }

        .ep-details h3 {
            font-size: 1rem;
            margin-bottom: 5px;
            color: var(--text-main);
        }

        .ep-details p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
        }

        .ep-meta-info {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: flex-end;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .rate-badge {
            border: 1px solid #444;
            padding: 2px 8px;
            border-radius: 3px;
            color: var(--text-main);
        }

        @media (max-width: 768px) {
            .ep-row {
                grid-template-columns: 60px 1fr;
            }

            .ep-meta-info {
                display: none;
            }

            .ep-thumbnail {
                width: 60px;
            }
        }

        /* ===== PLAYER MODAL ===== */
        .player-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 2000; display: none; align-items: flex-start; justify-content: center;
            padding: 20px; overflow-y: auto; backdrop-filter: blur(5px);
        }

        .player-box {
            width: 100%; max-width: 1000px; max-height: calc(100vh - 40px);
            background: var(--card-30); /* ประยุกต์ใช้ 30% ให้กล่องวิดีโอลอยเด่นขึ้นมาจากพื้นหลัง */
            border-radius: 12px; overflow: auto; position: relative; margin: 20px auto;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .close-btn {
            position: fixed; right: 18px; top: 18px; z-index: 2100;
            background: rgba(15, 15, 15, 0.92); color: var(--text-main); border: 1px solid var(--line-soft);
            width: 42px; height: 42px; border-radius: 50%; cursor: pointer; font-size: 1.2rem;
            transition: var(--transition); box-shadow: 0 6px 18px rgba(0,0,0,0.35);
        }
        .close-btn:hover { background: var(--accent-10); } /* ประยุกต์ใช้ 10% */

        .video-details { padding: 30px; }
        .video-meta-row { display: flex; align-items: center; gap: 15px; margin: 10px 0 20px; color: var(--text-muted); font-size: 0.95rem; }
        .rate-badge { border: 1px solid #444; padding: 1px 6px; font-size: 0.8rem; border-radius: 3px; color: var(--text-main); }
        .credits-box { margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; color: var(--text-muted); }
        .credits-box span { color: var(--text-main); }

        /* ===== FOOTER ===== */
        footer { padding: 50px 5%; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); color: #444; background: #070707; }
        .social { margin-bottom: 15px; font-size: 1.5rem; display: flex; justify-content: center; gap: 20px; }
        .social a { color: #444; transition: var(--transition); }
        .social a:hover { color: var(--accent-10); } /* ประยุกต์ใช้ 10% */

        @media (max-width: 768px) { .hero { background-position: 75% center; } }

        @media (max-height: 760px), (max-width: 520px) {
            #splash-screen {
                padding: 16px 12px;
            }

            .splash-content {
                padding: 12px;
            }

            .royal-image {
                max-height: 32vh;
                margin-bottom: 14px;
            }

            .splash-text {
                font-size: 21px;
            }

            .splash-title {
                font-size: 15px;
                margin-bottom: 12px;
            }

            .splash-space {
                margin: 12px auto;
            }

            .enter-btn {
                margin-top: 18px;
                margin-bottom: 8px;
            }
        }
    </style>
</head>
<body>

    <nav id="navbar">
        <a href="#" class="logo">
            <img src="https://i.ibb.co/VcLBbLB0/3364-removebg-preview-1.png" alt="Logo">
        </a>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <p class="hero-tag"><i class="fas fa-play-circle"></i> TRIPPLENCJ ORIGINAL</p>
            <h1>BREAKPOINT</h1>
            <p style="margin-bottom: 25px; color: var(--text-muted); font-size: 1.1rem;">
                ซีรีส์สืบสวนลึกลับที่พาคุณดิ่งลึกสู่ปริศนาและการหักหลัง <br>ร่วมค้นหาความจริงที่ถูกซ่อนไว้ภายใต้คำลวง
            </p>

    <main class="section">
        <h2 class="section-title">Breakpoint: ทุกตอน</h2>
        <div class="season-selector" id="seasonSelector"></div>
        <div class="episodes-list" id="episodeList"></div>

    <footer>
        <div class="social">
            <a href="https://youtube.com/@TrippleNCJ" target="_blank"><i class="fab fa-youtube"></i></a>

        </div>
        <p>© 2026 TRIPPLENCJ STUDIO. All Rights Reserved.</p>
    </footer>

    <div class="player-overlay" id="playerOverlay">
        <div class="player-box">
            <button class="close-btn" onclick="closePlayer()">✕</button>
            <div id="videoFrame"></div>
            <div class="video-details">
                <h2 id="vTitle"></h2>
                <div class="video-meta-row">
                    <span id="vEp" style="color:var(--accent-10); font-weight:600;"></span>
                    <span id="vDur"></span>
                    <span class="rate-badge" id="vRate"></span>
                </div>
                <p id="vDesc" style="color: var(--text-main);"></p>
                <div class="credits-box">
                    🎬 ทีมงานสร้างสรรค์: <span id="vCredits"></span>
                </div>
            </div>
        </div>
    </div>

    <script>

        

        const driveBase = "https://drive.google.com/file/d/";

        const episodes = [
            {
                id: "uOlQF24CTXY", season: 1, ep: "EP.1", title: "จุดเริ่มต้น",
                dur: "2 นาที 49 วินาที", rate: "13+",
                driveId: "1M1cL2hv8oIWLR1ZdHWTXgIsMI4NYX4kY",
                videoUrl: driveBase + "1M1cL2hv8oIWLR1ZdHWTXgIsMI4NYX4kY/preview?usp=sharing",
                poster: "https://img.youtube.com/vi/uOlQF24CTXY/maxresdefault.jpg",
                desc: "ซีรีส์สืบสวนลึกลับสุดเข้มข้นที่เต็มไปด้วยปริศนาและความจริงที่ไม่มีใครคาดคิด",
                credits: "Nikonpan, Nasa and Newtun"
            },
            {
                id: "WrFwGxEqB3M", season: 1, ep: "EP.2", title: "ความจริงเริ่มเผย",
                dur: "2 นาที 48 วินาที", rate: "13+",
                driveId: "1tXGhOxXgfQvgZ-jDB-eBHi5exSBEk1Bc",
                videoUrl: driveBase + "1tXGhOxXgfQvgZ-jDB-eBHi5exSBEk1Bc/preview?usp=sharing",
                poster: "https://img.youtube.com/vi/WrFwGxEqB3M/maxresdefault.jpg",
                desc: "เมื่อทวีสันต์เริ่มเปิดโรงงาน และรับสมัครงาน ท่ามกลางสายตาที่จับจ้อง",
                credits: "Nikonpan, Nasa and Newtun"
            },
            {
                id: "wXiwxUFf1aU", season: 1, ep: "EP.3", title: "อดีตที่ถูกซ่อน",
                dur: "3 นาที 22 วินาที", rate: "13+",
                driveId: "1QSghpbLTKyA4dYDtRCRPGU9bW7Df0mbT",
                videoUrl: driveBase + "1QSghpbLTKyA4dYDtRCRPGU9bW7Df0mbT/preview?usp=sharing",
                poster: "https://img.youtube.com/vi/wXiwxUFf1aU/maxresdefault.jpg",
                desc: "ทวีสันต์โดนภัทรนนท์หักหลัง ความเชื่อใจที่เคยมีเริ่มพังทลาย",
                credits: "Nikonpan, Nasa and Newtun"
            },
            {
                id: "jd4Ia9OtpNs", season: 1, ep: "EP.3.5", title: "ตอนพิเศษ",
                dur: "2 นาที 30 วินาที", rate: "13+",
                driveId: "1aTSr6A76VQRE_aCqNTdwnT6XaiIm7uWA",
                videoUrl: driveBase + "1aTSr6A76VQRE_aCqNTdwnT6XaiIm7uWA/preview?usp=sharing",
                poster: "https://img.youtube.com/vi/jd4Ia9OtpNs/maxresdefault.jpg",
                desc: "เบื้องหลังและมุมมองอีกด้านที่ความจริงอาจไม่ได้มีเพียงด้านเดียว",
                credits: "Nikonpan, Nasa and Newtun"
            },
            {
                id: "ZUU6_Heef8s", season: 1, ep: "EP.4", title: "จุดแตกหัก",
                dur: "2 นาที 50 วินาที", rate: "13+",
                driveId: "1KUG1p_iyLd57gBE4h44fpMKn2Qia5sqU",
                videoUrl: driveBase + "1KUG1p_iyLd57gBE4h44fpMKn2Qia5sqU/preview?usp=sharing",
                poster: "https://img.youtube.com/vi/ZUU6_Heef8s/maxresdefault.jpg",
                desc: "ทุกคนเริ่มไม่ไว้ใจกัน บรรยากาศแห่งความหวาดระแวงเข้าปกคลุม",
                credits: "Nikonpan, Nasa and Newtun"
            },
            {
                id: "uOlQF24CTXY", season: 1, ep: "EP.5", title: "ตอนที่ 5",
                dur: "3 นาที 23 วินาที", rate: "13+",
                driveId: "1x_oCOGmxQXn53Hn_f2SEov9rRf4pd3_r",
                videoUrl: driveBase + "1x_oCOGmxQXn53Hn_f2SEov9rRf4pd3_r/preview?usp=sharing",
                poster: "https://i.ytimg.com/vi/AB5CFw8a8Wo/hqdefault.jpg?sqp=-oaymwEmCKgBEF5IWvKriqkDGQgBFQAAiEIYAdgBAeIBCggYEAIYBjgBQAE=&rs=AOn4CLAMbGUfJhsRhgPdAm5b7f5RO4UbsQ",
                desc: "ทวีสันต์ไม่มีทางไปต่อ",
                credits: "Nikonpan, Nasa and Newtun"
            },
            {
                id: "uOlQF24CTXY", season: 1, ep: "EP.6", title: "ตอนที่ 6",
                dur: "4 นาที 29 วินาที", rate: "13+",
                driveId: "1Dw2sSX2bwdQ1yJcB1DsyImvlSD-p2K3l",
                videoUrl: driveBase + "1Dw2sSX2bwdQ1yJcB1DsyImvlSD-p2K3l/preview?usp=sharing",
                poster: "https://i.ytimg.com/vi/XI034mQajes/hqdefault.jpg?sqp=-oaymwEmCKgBEF5IWvKriqkDGQgBFQAAiEIYAdgBAeIBCggYEAIYBjgBQAE=&rs=AOn4CLDewN_YsoiZuijajLI-x6z0HANRag",
                desc: "ทวีสันต์ถูกรักพาตัว",
                credits: "Nikonpan, Nasa and Newtun"
            },
            {
                id: "uOlQF24CTXY", season: 1, ep: "EP.7", title: "ตอนที่ 7",
                dur: "5 นาที 57 วินาที", rate: "13+",
                driveId: "1fDn1dq-QPFeQOKaKyZpHa1xO2iPflRrO",
                videoUrl: driveBase + "1fDn1dq-QPFeQOKaKyZpHa1xO2iPflRrO/preview?usp=sharing",
                poster: "https://i.ytimg.com/vi/ic_CyQXVC2U/hqdefault.jpg?sqp=-oaymwEmCKgBEF5IWvKriqkDGQgBFQAAiEIYAdgBAeIBCggYEAIYBjgBQAE=&rs=AOn4CLADzctQZJMo0rfH4r8WwKE5cAuhdw",
                desc: "ทวีสันต์รับสมัครพนักงานเพิ่ม",
                credits: "Nikonpan, Nasa and Newtun"
            },
            {
                id: "uOlQF24CTXY", season: 1, ep: "EP.8", title: "ตอนที่ 8",
                dur: "6 นาที 17 วินาที", rate: "13+",
                driveId: "1D8eyfB3-ZhmmPOQud8qLybTuWcGDvBgZ",
                videoUrl: driveBase + "1D8eyfB3-ZhmmPOQud8qLybTuWcGDvBgZ/preview?usp=sharing",
                poster: "videoframe_361773.png",
                desc: "เคนขึ้นมารับหน้าที่แทนคณิต",
                credits: "Nikonpan, Nasa and Newtun"
            }
        ];

        let currentSeason = 1;

        // Initialize season selector
        const seasons = [...new Set(episodes.map(ep => ep.season))].sort();
        const seasonSelector = document.getElementById('seasonSelector');
        seasons.forEach(season => {
            const btn = document.createElement('button');
            btn.className = 'season-btn' + (season === 1 ? ' active' : '');
            btn.innerText = `Season ${season}`;
            btn.onclick = () => switchSeason(season);
            seasonSelector.appendChild(btn);
        });

        function switchSeason(season) {
            currentSeason = season;
            // Update active button
            document.querySelectorAll('.season-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            // Render episodes for selected season
            renderEpisodes(season);
        }

        function renderEpisodes(season) {
            const container = document.getElementById('episodeList');
            container.innerHTML = '';
            const seasonEpisodes = episodes.filter(ep => ep.season === season);
            seasonEpisodes.forEach((item, index) => {
                const actualIndex = episodes.indexOf(item);
                container.innerHTML += `
                    <div class="ep-row" onclick="playVideo(${actualIndex})">
                        <img src="${item.poster}" alt="${item.ep}" class="ep-thumbnail">
                        <div class="ep-details">
                            <h3>${item.ep}: ${item.title}</h3>
                            <p>${item.desc}</p>
                        </div>
                        <div class="ep-meta-info">
                            <span><i class="far fa-clock"></i> ${item.dur}</span>
                            <span class="rate-badge">${item.rate}</span>
                        </div>
                    </div>
                `;
            });
        }

        // Initial render
        renderEpisodes(1);

        function playVideo(index) {
            const data = episodes[index];
            const overlay = document.getElementById('playerOverlay');
            document.getElementById('videoFrame').innerHTML = `
                <iframe src="${data.videoUrl}" allow="autoplay; encrypted-media" allowfullscreen
                    style="width:100%; aspect-ratio:16/9; border:none; background:#000;"></iframe>
            `;
            document.getElementById('vTitle').innerText = `Breakpoint: ${data.title}`;
            document.getElementById('vEp').innerText = data.ep;
            document.getElementById('vDur').innerText = data.dur;
            document.getElementById('vRate').innerText = data.rate;
            document.getElementById('vDesc').innerText = data.desc;
            document.getElementById('vCredits').innerText = data.credits;
            
            overlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closePlayer() {
            document.getElementById('playerOverlay').style.display = 'none';
            document.getElementById('videoFrame').innerHTML = '';
            document.body.style.overflow = 'auto';
        }

        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar');
            window.scrollY > 50 ? nav.classList.add('scrolled') : nav.classList.remove('scrolled');
        });
    </script>
</body>
</html>
